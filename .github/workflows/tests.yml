name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No dependencies to install: the library and tests use only the standard library.
      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: CLI smoke test
        run: python -m clara examples/data/blobs.csv -k 3 --label-column 2 --seed 0 --silhouette -q

      - name: Quickstart example
        run: python examples/quickstart.py
